server.port=8080
spring.application.name=agrivision-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/agrivision_db
spring.datasource.username=agri_admin
spring.datasource.password=AgriSecurePassword123!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Node.js AI Vision Microservice URL
ai.service.url=http://localhost:5000/api/predict

# Logging
logging.level.com.agrivision=DEBUG
logging.level.org.springframework.web=INFO
